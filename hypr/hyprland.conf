#################
### NVIDIA Fix ###
#################
# NVIDIA RTX 3060 - Wayland configuration
# Compatible con Hyprland 0.54.3

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = NVD_BACKEND,direct
env = NVIDIA_DRIVER_CAPABILITIES,all
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = ELECTRON_DISABLE_GPU,0
env = DISABLE_LAYER_ASHMEM,1
env = _JAVA_AWT_WM_NONREPARENTING,1

# Cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# XDG Base
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_DATA_HOME,$HOME/.local/share

#############################
### RENDER & COMPOSITOR   ###
#############################
opengl {
    nvidia_anti_flicker = true
    vulkan = true
}

misc {
    vfr = false
    # animate_manual_resizes = true
    # mouse_move_enables_dpms = true
    # no_cursor_warps = true
    focus_on_activate = true
}

# Animaciones suaves (desactivadas por rendimiento NVIDIA)
animations {
    enabled = false
}

###############
### Monitor ###
###############
monitor=,preferred,auto,1

# Generar 10 workspaces
exec-once = for i in $(seq 1 10); do hyprctl dispatch workspace $i; done

###################
### AUTOSTART    ###
###################
exec-once = bash ~/.config/hypr/scripts/startup.sh

###############
### INPUT     ###
###############
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# Fcitx5 input method
exec-once = fcitx5 -d

###################
### DECORATION ###
###################
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = on
        ignore_opacity = false
        noise = 0.0117
        contrast = 0.1646
        brightness = 1.0
        xray = false
        special = false
        popups = true
        popups_ignorealpha = 0
    }

    # Sombras
    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(000000ee)
}

###############
### GENERAL ###
###############
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(00ff99ff) rgba(00ff9988) 45deg
    col.inactive_border = rgba(00ff9933) rgba(00ff9911) 45deg
    col.nogroup_border = rgba(ffffff22)
    col.nogroup_border_active = rgba(ffffff44)
    layout = dwindle
}

# Gestos
gestures {
    workspace_swipe = on
}

###############
### WINDOWRULE ###
###############
# Ventanas flotantes
windowrulev2 = float, class:^(thunar)$, title:^(File Manager$)
windowrulev2 = size 600 450, class:^(nmtui)$, title:^(nmtui)$

# Pantalla completa para ciertas apps
windowrulev2 = fullscreen, class:^(obs)$, title:^(OBS)$
windowrulev2 = fullscreen, class:^(mpv)$, title:^(^mpv$)

# Sticky notes siempre visible
windowrulev2 = pinned, class:^(Eww)$

# GDevelop centrado
windowrulev2 = center 1, class:^(GDevelop)$, title:^(GDevelop5)$

###############
### KEYBINDINGS ###
###############

# ── Terminal ──
bind = SUPER, R, exec, alacritty
bind = SUPER, Return, exec, alacritty

# ── Browser ──
bind = SUPER, E, exec, ~/.config/hypr/scripts/launch-app.sh brave

# ── File Manager ──
bind = SUPER, F, exec, thunar

# ── App Launcher ──
bind = SUPER, D, exec, ~/.config/wofi/wofi-launch.sh --show drun

# ── Communication ──
bind = SUPER, C, exec, ~/.config/hypr/scripts/launch-app.sh discord

# ── Gaming ──
bind = SUPER, S, exec, ~/.config/hypr/scripts/launch-app.sh steam

# ── Development ──
bind = SUPER, V, exec, code

# ── Music ──
bind = SUPER, M, exec, ~/.config/hypr/scripts/launch-app.sh spotify || spotify

# ── Screenshots ──
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copiado al clipboard"
bind = SUPERSHIFT, 3, exec, grim ~/Pictures/screenshot_$(date +%F_%T).png && notify-send "Screenshot" "Guardado en ~/Pictures/"
bind = SUPERSHIFT, 4, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%F_%T).png && notify-send "Screenshot" "Guardado en ~/Pictures/"
bind = SUPERSHIFT, 5, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Región copiada al clipboard"

# ── Screen Recording ──
bind = SUPERSHIFT, 6, exec, ~/.config/hypr/scripts/obs-recording.sh

# ── Close / Exit ──
bind = SUPER, Q, killactive
bind = SUPER, M, exit

# ── Notes ──
bind = SUPER, N, exec, alacritty -e nano ~/.local/share/kuri-notes/nota.txt

# ── Focus Movement ──
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# ── Workspaces ──
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# ── Move to Workspace ──
bind = SUPERSHIFT, 1, movetoworkspace, 1
bind = SUPERSHIFT, 2, movetoworkspace, 2
bind = SUPERSHIFT, 3, movetoworkspace, 3
bind = SUPERSHIFT, 4, movetoworkspace, 4
bind = SUPERSHIFT, 5, movetoworkspace, 5
bind = SUPERSHIFT, 6, movetoworkspace, 6
bind = SUPERSHIFT, 7, movetoworkspace, 7
bind = SUPERSHIFT, 8, movetoworkspace, 8
bind = SUPERSHIFT, 9, movetoworkspace, 9
bind = SUPERSHIFT, 0, movetoworkspace, 10

# ── Input Method ──
bind = SUPER, minus, exec, fcitx5-remote -t

# ── Idle & Lock ──
exec-once = swayidle \
    timeout 900 'hyprlock -f' \
    before-sleep 'hyprlock -f'

# ── Lock Screen ──
bind = SUPERSHIFT, L, exec, hyprlock -f

###################
### STATUSBAR    ###
###################
# No statusbar — usamos waybar/Eww

###################
### MISCELLANEOUS ###
###################
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_mouse_windowdragging = true
}

# Click to focus
general {
    no_cursor_fallback_opacity = 0.0
}
