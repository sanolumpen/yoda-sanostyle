##############################
### HYPRLAND 0.54.3 — YODA ###
### NVIDIA RTX 3060 · Debian 13
##############################

###############
### NVIDIA  ###
###############
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = NVD_BACKEND,direct
env = NVIDIA_DRIVER_CAPABILITIES,all
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Java AWT fix
env = _JAVA_AWT_WM_NONREPARENTING,1

# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#########################
### RENDER (NVIDIA)    ###
#########################
opengl {
    nvidia_anti_flicker = true
}

###############
### Monitor ###
###############
monitor=,preferred,auto,1

###############
### AUTOSTART
###############
exec-once = export XDG_RUNTIME_DIR=/run/user/$(id -u)
exec-once = bash ~/.config/hypr/scripts/startup.sh

###################
### INPUT        ###
###################
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

###################
### DECORATION  ###
###################
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = on
        ignore_opacity = false
        xray = false
        popups = true
        noise = 0.0117
        contrast = 0.1646
        brightness = 1.0
    }
}

##############
### LAYOUT ###
##############
animations {
    enabled = false
}

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(00ff99ff) rgba(00ff9988) 45deg
    col.inactive_border = rgba(00ff9933) rgba(00ff9911) 45deg
    layout = dwindle
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
    vfr = false
}

###############
### WINDOWS  ###
###############
# Thunar siempre flotante
windowrule {
    name = thunar-float
    match:class = ^(thunar)$
    float = yes
}

# nmtui tamaño fijo
windowrule {
    name = nmtui-fixed
    match:class = ^(nmtui)$
    float = yes
    move = 600 450
}

# OBS pantalla completa
windowrule {
    name = obs-fullscreen
    match:class = ^(obs)$
    fullscreen = yes
}

# mpv pantalla completa
windowrule {
    name = mpv-fullscreen
    match:class = ^(mpv)$
    fullscreen = yes
}

# GDevelop centrado y flotante
windowrule {
    name = gdevelop-centered
    match:class = ^(GDevelop)$ title:^(GDevelop5)$
    float = yes
    center = yes
}

###############
### KEYBIND  ###
###############
# Terminal
bind = SUPER, R, exec, alacritty
bind = SUPER, Return, exec, alacritty

# Browser
bind = SUPER, E, exec, ~/.config/hypr/scripts/launch-app.sh brave

# File manager
bind = SUPER, F, exec, thunar

# Discord
bind = SUPER, C, exec, ~/.config/hypr/scripts/launch-app.sh discord

# Steam
bind = SUPER, S, exec, ~/.config/hypr/scripts/launch-app.sh steam

# Blender
bind = SUPER, B, exec, blender

# App Launcher
bind = SUPER, D, exec, ~/.config/wofi/wofi-launch.sh --show drun

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copiado al clipboard"
bind = SUPERSHIFT, 3, exec, grim ~/Pictures/screenshot_$(date +%F_%T).png && notify-send "Screenshot" "Guardado en ~/Pictures/"
bind = SUPERSHIFT, 4, exec, grim -g "$(slurp)" - | tee ~/Pictures/screenshot_$(date +%F_%T).png | wl-copy && notify-send "Screenshot" "Guardado y copiado"

# Screen Recording
bind = SUPERSHIFT, 6, exec, ~/.config/hypr/scripts/obs-recording.sh

# Close / Exit
bind = SUPER, Q, killactive
bind = SUPER, M, exit

# Volume / Brightness (media keys)
bind = ,XF86MonBrightnessUp, exec, brightnessctl s +10%
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Notes
bind = SUPER, N, exec, alacritty -e nano ~/.local/share/kuri-notes/nota.txt

# Focus
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move ventana a workspace
bind = SUPERSHIFT, 1, movetoworkspace, 1
bind = SUPERSHIFT, 2, movetoworkspace, 2
bind = SUPERSHIFT, 3, movetoworkspace, 3
bind = SUPERSHIFT, 4, movetoworkspace, 4
bind = SUPERSHIFT, 5, movetoworkspace, 5
bind = SUPERSHIFT, 6, movetoworkspace, 6
bind = SUPERSHIFT, 7, movetoworkspace, 7
bind = SUPERSHIFT, 8, movetoworkspace, 8
bind = SUPERSHIFT, 9, movetoworkspace, 9
bind = SUPERSHIFT, 0, movetoworkspace, 10

# Input Method toggle
bind = SUPER, minus, exec, fcitx5-remote -t

# Idle & Lock
exec-once = swayidle \
    timeout 900 'hyprlock -f' \
    before-sleep 'hyprlock -f'

bind = SUPERSHIFT, L, exec, hyprlock -f
