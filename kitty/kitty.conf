# ──────────────────────────────────────────────
# ⚔️ Yoda Theme — Lightsaber Green Edition
# Replicación del tema Alacritty Yoda
# ──────────────────────────────────────────────

# Shell
shell /usr/bin/zsh

# Window
window_padding_width 12
hide_window_decorations yes
background_opacity 0.4

# Font
font_family JetBrains Mono Medium
font_size 13.5

# Cursor
cursor_shape beam
cursor_blink_interval 500

# Scrollback
scrollback_lines 10000

# ──────────────────────────────────────────────
# 🎨 Color Palette — Lightsaber Green + Tech Noir
# ──────────────────────────────────────────────

# Primary colors
background #050705
foreground #b9f6ca

# ANSI Colors (0-7)
color0 #0a0d0a
color1 #ff4d4d
color2 #00ff99
color3 #ffee58
color4 #00bfff
color5 #cc66ff
color6 #00ffe1
color7 #e5e5e5

# Bright Colors (8-15)
color8 #1b1b1b
color9 #ff6666
color10 #66ffb2
color11 #fff176
color12 #33ccff
color13 #d580ff
color14 #80fff4
color15 #ffffff

# ──────────────────────────────────────────────
# 🔧 Terminal
# ──────────────────────────────────────────────

term xterm-256color

# Performance
repaint_delay 10
input_delay 3

# ──────────────────────────────────────────────
# ⌨️  Keybindings — Custom Commands
# ──────────────────────────────────────────────

# sano-fetch: Show system info + animated GIF (use absolute path)
map ctrl+shift+f send_text "~/.local/bin/sano-fetch\r"

# Alternative if Ctrl+Shift+F conflicts:
# map super+f send_text "~/.local/bin/sano-fetch\r"